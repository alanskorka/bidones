<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bidones | Grupos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Bidones</h1>
          <p>Creacion y seleccion de grupos</p>
        </div>
        <div class="group-box">
          <label for="groupSelect">Grupo activo</label>
          <select id="groupSelect"></select>
        </div>
      </header>

      <nav class="nav">
        <a href="/asignacion">Asignacion</a>
        <a href="/grupos">Grupos</a>
        <a href="/plantel">Plantel</a>
        <a href="/historial">Historial</a>
      </nav>

      <div id="notice" class="notice"></div>

      <section class="grid">
        <article class="card cols-4">
          <h2>Crear grupo</h2>
          <label for="newGroupInput">Nombre del grupo</label>
          <input id="newGroupInput" type="text" placeholder="Ej: Hebraica" />
          <button id="btnCreateGroup" type="button">Crear grupo</button>
        </article>

        <article class="card cols-8">
          <h2>Grupos existentes</h2>
          <ul id="groupsList" class="list"></ul>
        </article>
      </section>
    </main>
    <script src="/common.js"></script>
    <script src="/grupos.js"></script>
  </body>
</html>
